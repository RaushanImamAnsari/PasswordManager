<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<div class="bg-white p-8 rounded shadow-md w-96">
    <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>
    <form th:action="@{/login}" method="post" class="flex flex-col gap-4">
        <select name="role" class="border p-2 rounded">
            <option value="admin">Admin</option>
            <option value="user">User</option>
        </select>
        <input type="text" name="username" placeholder="Username" class="border p-2 rounded" required>
        <input type="password" name="password" placeholder="Password" class="border p-2 rounded" required>
        <button type="submit" class="bg-blue-500 text-white p-2 rounded">Login</button>
        <div th:if="${param.error}" class="text-red-500 text-center">Invalid credentials!</div>
    </form>
</div>
</body>
</html>
